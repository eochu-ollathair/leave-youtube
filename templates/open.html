<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Leave YouTube</title><style>body{min-height:100vh;display:grid;place-items:center;margin:0;background:#11151b;color:#f0f3f1;font:17px system-ui,sans-serif}main{max-width:450px;padding:24px}h1{font-size:34px;line-height:1.1}p{color:#b4c2c5}</style></head>
<body><main><h1>Leave YouTube</h1><p id="message">Opening your private settings…</p></main>
<script>
const base={{ base|tojson }};
const key=new URLSearchParams(location.hash.slice(1)).get('key');
if(!key){document.querySelector('#message').textContent='Open the private link saved for this page.'}
else fetch(base+'/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})}).then(r=>{if(!r.ok)throw Error('That private link did not work.');history.replaceState(null,'',base+'/');location.reload()}).catch(e=>{document.querySelector('#message').textContent=e.message});
</script></body></html>
